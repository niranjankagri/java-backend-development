# Served by config-server to the service named "order-service" (its spring.application.name):
#   GET http://localhost:8888/order-service/default
# These values win over the ones in order-service's own application-orders.properties.

# orders from this amount (INR) ship for free
orders.free-shipping-from=500
# the fee we charge when shipping-service cannot tell us the real one (topics 4 and 5)
orders.fallback-shipping-fee=99
