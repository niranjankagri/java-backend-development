spring.application.name=school
spring.datasource.url=jdbc:h2:mem:school

# Hibernate creates the tables from the @Entity classes at startup and drops them at shutdown.
# Fine for learning and tests; real databases use Flyway/Liquibase migrations and ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=create-drop
# Run data.sql AFTER Hibernate has created the tables (by default it would run before)
spring.jpa.defer-datasource-initialization=true

# Print the SQL Hibernate generates, formatted (same as spring.jpa.show-sql, but through the logger)
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

# No web layer here; keep the database session closed outside transactions (see LazyInitialization tests)
spring.jpa.open-in-view=false
