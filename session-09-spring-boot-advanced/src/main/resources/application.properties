spring.application.name=order-desk

# Log levels per package: DEBUG for our code (shows ServiceTraceAspect), INFO for everything else
logging.level.root=INFO
logging.level.jbdl.session09=DEBUG

# Console pattern with the request id from the MDC ([-] when a line is not part of a request)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:--}] %logger{36} - %msg%n

# Write to a file as well (rolled by size by Logback); uncomment to try
#logging.file.name=target/order-desk.log
