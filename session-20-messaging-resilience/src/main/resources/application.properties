# Settings shared by all four services of this module. Each service adds its own file through its
# profile: application-config-server, application-orders, application-notifications, application-shipping.

# Every service here has the Spring Cloud Config client on its classpath (one module, one classpath).
# Only order-service and notification-service import settings from config-server (spring.config.import
# in their own file); this line stops the client from refusing to start the other two without one.
spring.cloud.config.import-check.enabled=false
