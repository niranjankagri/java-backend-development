spring.application.name=github-login
spring.datasource.url=jdbc:h2:mem:members
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# "Log in with GitHub". The registration id "github" is one Spring Boot knows: it fills in GitHub's
# authorize, token and user-info addresses by itself. Only the app's own id and secret are needed,
# from your GitHub OAuth App (see the README). They come from environment variables and are never
# written into the code; the placeholders keep the app (and the tests) starting without them.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:set-GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:set-GITHUB_CLIENT_SECRET}
# Ask only for what the app needs: reading the profile. (No "repo" scope: the app lists public repos only.)
spring.security.oauth2.client.registration.github.scope=read:user

# GitHub logins that get the ADMIN role, comma separated, e.g. APP_ADMIN_LOGINS=niranjankagri
app.admin-logins=${APP_ADMIN_LOGINS:}

# Show why a request was allowed or refused (very useful while learning; too noisy for production)
#logging.level.org.springframework.security=DEBUG
