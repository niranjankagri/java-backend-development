spring.application.name=splitwise
spring.datasource.url=jdbc:h2:mem:splitwise
# tables from the entities (the generated schema is documented in the Session 12 README)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Session 17: cached balances in memory by default (Redis in the prod profile)
spring.cache.type=simple

# Session 17: the first admin account (development values; prod reads them from environment variables)
splitwise.admin.email=admin@splitwise.local
splitwise.admin.password=admin-password-dev

# Session 17: only the health endpoint of Actuator is exposed over HTTP
management.endpoints.web.exposure.include=health
# No Redis server in development: without this, the Redis health check is DOWN and /actuator/health
# answers 503 even though the app works (the SecurityTest found it). The prod profile turns it back on.
management.health.redis.enabled=false
