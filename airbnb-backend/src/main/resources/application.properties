spring.application.name=airbnb
spring.datasource.url=jdbc:h2:mem:airbnb
# tables from the entities (the generated schema is documented in the Session 21 README, topic 3)
spring.jpa.hibernate.ddl-auto=create-drop
# no lazy loading while the JSON is written: every service method loads what its answer needs
spring.jpa.open-in-view=false
