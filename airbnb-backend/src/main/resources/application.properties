spring.application.name=airbnb
spring.datasource.url=jdbc:h2:mem:airbnb
# Development and tests: tables from the entities (the generated schema is documented in the Session 21
# README, topic 3). Production (the prod profile, Session 23) uses Flyway migrations and only validates.
spring.jpa.hibernate.ddl-auto=create-drop
# the migrations in db/migration are written for PostgreSQL (V2 uses an exclusion constraint), so not on H2
spring.flyway.enabled=false
# no lazy loading while the JSON is written: every service method loads what its answer needs
spring.jpa.open-in-view=false

# Session 23: only the health endpoint of Actuator is reachable over HTTP, with the liveness and
# readiness groups a container platform asks (/actuator/health/liveness, /actuator/health/readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
