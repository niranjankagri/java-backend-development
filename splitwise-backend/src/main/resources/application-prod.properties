# Session 17: production settings, used with --spring.profiles.active=prod (see compose.yaml).
# Every secret comes from an environment variable: nothing sensitive is in the code or the image.

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/splitwise}
spring.datasource.username=${DATABASE_USER:splitwise}
spring.datasource.password=${DATABASE_PASSWORD}
# Hibernate keeps the schema up to date. A real project would use Flyway migrations + ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=10m

splitwise.admin.email=${SPLITWISE_ADMIN_EMAIL:admin@splitwise.local}
splitwise.admin.password=${SPLITWISE_ADMIN_PASSWORD}

# Health details for the container platform (database, Redis, disk); Redis is checked again here
management.health.redis.enabled=true
management.endpoint.health.show-details=always
