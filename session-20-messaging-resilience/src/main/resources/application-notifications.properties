# notification-service settings (loaded through the "notifications" profile)
# spring.application.name (notification-service) is set in the application class, see its builder()
server.port=8201

# Topic 3: settings from config-server when it runs; this local template otherwise
spring.config.import=optional:configserver:http://localhost:8888
notifications.template=Hi %s, order %s is confirmed (total %s INR).

# Topic 2: read the events from Kafka
spring.kafka.bootstrap-servers=localhost:9092
# The consumer GROUP: Kafka gives each event to ONE member of a group. Start this service twice and
# the partitions are shared between the two; a different group (say "analytics") would get every
# event too, independently.
spring.kafka.consumer.group-id=notification-service
# A new group starts at the oldest event still stored, so nothing sent before the first start is missed
spring.kafka.consumer.auto-offset-reset=earliest
# JSON into OUR OrderPlaced class (the producer sends no class names, see application-orders.properties)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=jbdl.session20.notifications.OrderPlaced
spring.kafka.consumer.properties.spring.json.use.type.headers=false
