# order-service settings (loaded through the "orders" profile, see OrderServiceApplication)
# spring.application.name (order-service) is set in the application class, see its builder()
server.port=8200

# Topic 3: also load settings from config-server, which looks them up by spring.application.name.
# "optional:" = if config-server is not running, start anyway with the values in this file.
spring.config.import=optional:configserver:http://localhost:8888

# Local values. When config-server is reachable, its order-service.properties wins over these
# (500 and 99): imported settings take precedence over the file that imports them.
orders.free-shipping-from=1000
orders.fallback-shipping-fee=150

# Topic 2: Kafka. Events are sent as JSON. No Java class names in the message headers: the consumer
# (notification-service) has its own OrderPlaced class and must not depend on ours.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Topics 4 and 5: shipping-service, and how order-service protects itself from it (ResilienceConfig)
shipping.url=http://localhost:8202
# give up on one call after 1 s
shipping.timeout=1s
# up to 3 attempts per quote, 200 ms apart
shipping.retry.max-attempts=3
shipping.retry.wait=200ms
# once the circuit is open, wait 10 s before letting one trial call through
shipping.circuit-breaker.wait-in-open=10s
