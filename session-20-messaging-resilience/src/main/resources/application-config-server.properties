# config-server settings (loaded through the "config-server" profile, see ConfigServerApplication)
spring.application.name=config-server
server.port=8888

# The "native" profile reads the settings from plain files, here the folder config-repo on the
# classpath. In production the usual source is a Git repository (spring.cloud.config.server.git.uri),
# so every settings change is a reviewed commit with history.
spring.cloud.config.server.native.search-locations=classpath:/config-repo/
