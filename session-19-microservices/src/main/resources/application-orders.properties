# order-service settings (loaded through the "orders" profile, see OrderServiceApplication)
spring.application.name=order-service
server.port=8190

# Where "catalog-service" runs. A fixed list here; in production a service registry (Eureka, Consul)
# or Kubernetes keeps this list up to date as instances start and stop (topic 4).
spring.cloud.discovery.client.simple.instances.catalog-service[0].uri=http://localhost:8191
spring.cloud.discovery.client.simple.instances.catalog-service[1].uri=http://localhost:8192
# A fixed list does not notice when an instance stops. "health-check" makes the load balancer ask every
# instance's /actuator/health every few seconds and skip the ones that do not answer UP.
spring.cloud.loadbalancer.configurations=health-check
spring.cloud.loadbalancer.health-check.interval=3s

# Never wait forever for another service: give up after 1 s to connect and 2 s for the answer.
spring.cloud.openfeign.client.config.catalog-service.connect-timeout=1000
spring.cloud.openfeign.client.config.catalog-service.read-timeout=2000
