# Session 23: production settings, used with the prod profile (SPRING_PROFILES_ACTIVE=prod, see the
# Dockerfile). Everything that differs between environments, secrets above all, comes from environment
# variables: the same image runs on a laptop, in a test environment and in production.

# The database: either one JDBC URL (DATABASE_URL, as in compose.yaml), or its parts (DATABASE_HOST,
# DATABASE_PORT, DATABASE_NAME), which is how Render hands over its managed PostgreSQL (Session 24,
# render.yaml). A placeholder's default can itself contain placeholders.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:airbnb}}
spring.datasource.username=${DATABASE_USER:airbnb}
spring.datasource.password=${DATABASE_PASSWORD}

# Session 24: cloud platforms tell the application which port to listen on (Render sets PORT)
server.port=${PORT:8080}

# The schema belongs to Flyway (db/migration). Hibernate creates nothing; at start-up it only checks
# that every entity matches a table and its columns, and refuses to start if not.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Stop gracefully: on SIGTERM (docker stop, a new release) refuse new requests, let running ones finish
# for up to 20 seconds, then shut down. (Graceful is the default since Spring Boot 3.4; written out here.)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# The health answer lists its parts (db, diskSpace, ping ...) with their status, but no details
# such as the database URL.
management.endpoint.health.show-components=always

# Session 24: logs as one JSON object per line (Elastic Common Schema), so a log service can search and
# filter by field (level, logger, message, error) instead of parsing text. Locally logs stay plain text.
logging.structured.format.console=ecs
