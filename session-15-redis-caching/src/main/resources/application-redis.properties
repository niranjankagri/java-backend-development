# Profile "redis": run with --spring.profiles.active=redis (and a Redis server, e.g.
#   docker run -d -p 6379:6379 redis:7.4-alpine )
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Every cached rate expires after 10 minutes, so a missed eviction can never serve old data forever
spring.cache.redis.time-to-live=10m
